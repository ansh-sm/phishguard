id: PG-RULE-001
name: Urgent Credential Harvesting Lure
description: Detects psychological urgency and account suspension threats combined with embedded action links.
author: PhishGuard SOC Lab
severity: HIGH
score_impact: 20.0
tags:
  - credential-harvest
  - urgency
  - initial-access
mitre:
  technique_id: T1566.002
  technique_name: Spearphishing Link
conditions:
  all:
    - field: body
      operator: regex_search
      patterns:
        - "(?i)(password|account|credential|access|login|security|identity).{0,60}(expire|suspend|disable|terminate|verify|action required|immediate|restrict|limit|closed)"
    - field: url_count
      operator: gt
      value: 0
